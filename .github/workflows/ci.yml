name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Java 21 with Maven cache
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3 — Build project and run all tests using H2 in-memory DB
      - name: Build and run tests
        run: mvn clean package -B -Dspring.profiles.active=test

      # Step 4 — Build Docker image to verify Dockerfile is valid
      - name: Build Docker image
        run: docker build -t userproject:latest .