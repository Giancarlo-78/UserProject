name: CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    # Job-level env — available in both services and steps
    env:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    # MySQL service container — required for integration tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_PASSWORD }}
          MYSQL_DATABASE: userdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -p${{ env.DB_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Step 1 — Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Install Java 21 with Maven cache
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3 — Build project and run all tests
      - name: Build and run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/userdb
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: mvn clean package -B

      # Step 4 — Build Docker image to verify Dockerfile is valid
      - name: Build Docker image
        run: docker build -t userproject:latest .