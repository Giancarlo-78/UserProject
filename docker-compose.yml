services:

  # ─── CONTAINER 1: DATABASE ───────────────────────────────
  mysql:
    image: mysql:8.0

    container_name: userproject-mysql

    environment:
      MYSQL_ROOT_PASSWORD: Giancarlo
      MYSQL_DATABASE: userdb


    ports:
      - "3307:3306"


    volumes:
      - mysql-data:/var/lib/mysql


    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pGiancarlo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── CONTAINER 2: APPLICATION SPRING BOOT ───────────────
  app:
    build: .

    container_name: userproject-app

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/userdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Giancarlo

    depends_on:
      mysql:
        condition: service_healthy

# ─── VOLUMES ──────────────────────────────────────────────────
volumes:
  mysql-data: